name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Grammar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Run corpus tests
        run: tree-sitter test
